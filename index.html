<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 이미지 생성기</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #20242e;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #6c8cff;
    --accent-2: #5573ff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 65px);
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  .controls {
    padding: 20px 24px;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .results {
    padding: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
    font-weight: 500;
  }
  input, select, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }
  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 100px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .key-row { display: flex; gap: 8px; align-items: center; }
  .key-row input { flex: 1; }
  .btn {
    background: var(--accent-2);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    font-weight: 600;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-weight: 500;
  }
  .btn-secondary:hover { background: var(--border); }
  .generate-btn { width: 100%; margin-top: 20px; padding: 14px; font-size: 15px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .status { margin-top: 16px; font-size: 13px; min-height: 18px; }
  .status.error { color: var(--danger); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card img { width: 100%; display: block; background: var(--panel-2); }
  .card-actions { padding: 10px; display: flex; gap: 8px; }
  .card-actions a, .card-actions button {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    padding: 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
  }
  .card-actions a:hover, .card-actions button:hover { background: var(--border); }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton {
    aspect-ratio: 1;
    background: linear-gradient(90deg, var(--panel-2) 25%, var(--border) 50%, var(--panel-2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 10px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <h1>🎨 AI 이미지 생성기</h1>
  <span class="hint">OpenAI Images API · 개인용</span>
</header>

<div class="layout">
  <aside class="controls">
    <label for="apikey">OpenAI API 키</label>
    <div class="key-row">
      <input type="password" id="apikey" placeholder="sk-..." autocomplete="off">
      <button class="btn-secondary" id="toggleKey" type="button">표시</button>
    </div>
    <div class="hint">키는 브라우저(localStorage)에만 저장되고 OpenAI로만 전송됩니다.</div>

    <label for="model">모델</label>
    <select id="model">
      <option value="gpt-image-2">gpt-image-2 (최신)</option>
      <option value="gpt-image-1">gpt-image-1</option>
      <option value="dall-e-3">dall-e-3</option>
      <option value="dall-e-2">dall-e-2</option>
    </select>

    <label for="prompt">프롬프트</label>
    <textarea id="prompt" placeholder="생성할 이미지를 설명하세요. 예) 노을 지는 바닷가에서 책을 읽는 고양이, 수채화 스타일"></textarea>

    <div class="row">
      <div>
        <label for="size">크기</label>
        <select id="size"></select>
      </div>
      <div>
        <label for="count">개수</label>
        <select id="count">
          <option>1</option><option>2</option><option>3</option><option>4</option>
        </select>
      </div>
    </div>

    <div class="row" id="qualityRow">
      <div>
        <label for="quality">품질</label>
        <select id="quality"></select>
      </div>
    </div>

    <button class="btn generate-btn" id="generate">이미지 생성</button>
    <div class="status" id="status"></div>
  </aside>

  <main class="results">
    <div class="grid" id="grid">
      <div class="empty">아직 생성된 이미지가 없습니다. 왼쪽에서 프롬프트를 입력하고 생성해보세요.</div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const els = {
  apikey: $('apikey'), toggleKey: $('toggleKey'), model: $('model'),
  prompt: $('prompt'), size: $('size'), count: $('count'),
  quality: $('quality'), qualityRow: $('qualityRow'),
  generate: $('generate'), status: $('status'), grid: $('grid'),
};

// 모델별 옵션 정의
const MODELS = {
  'gpt-image-2': {
    sizes: ['1024x1024', '1536x1024', '1024x1536', 'auto'],
    qualities: ['auto', 'high', 'medium', 'low'],
    maxN: 4,
  },
  'gpt-image-1': {
    sizes: ['1024x1024', '1536x1024', '1024x1536', 'auto'],
    qualities: ['auto', 'high', 'medium', 'low'],
    maxN: 4,
  },
  'dall-e-3': {
    sizes: ['1024x1024', '1792x1024', '1024x1792'],
    qualities: ['standard', 'hd'],
    maxN: 1,
  },
  'dall-e-2': {
    sizes: ['1024x1024', '512x512', '256x256'],
    qualities: null,
    maxN: 4,
  },
};

function fillSelect(sel, items) {
  sel.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join('');
}

function applyModel() {
  const m = MODELS[els.model.value];
  fillSelect(els.size, m.sizes);
  if (m.qualities) {
    fillSelect(els.quality, m.qualities);
    els.qualityRow.style.display = '';
  } else {
    els.qualityRow.style.display = 'none';
  }
  // 개수 제한
  const max = m.maxN;
  els.count.innerHTML = Array.from({length: max}, (_, i) => `<option>${i+1}</option>`).join('');
}

// 키 저장/복원
els.apikey.value = localStorage.getItem('openai_key') || '';
els.apikey.addEventListener('input', () => localStorage.setItem('openai_key', els.apikey.value.trim()));
els.toggleKey.addEventListener('click', () => {
  const isPw = els.apikey.type === 'password';
  els.apikey.type = isPw ? 'text' : 'password';
  els.toggleKey.textContent = isPw ? '숨김' : '표시';
});
els.model.addEventListener('change', applyModel);
applyModel();

function setStatus(msg, isError = false, loading = false) {
  els.status.className = 'status' + (isError ? ' error' : '');
  els.status.innerHTML = (loading ? '<span class="spinner"></span>' : '') + msg;
}

function showSkeletons(n) {
  els.grid.innerHTML = Array.from({length: n}, () => '<div class="skeleton"></div>').join('');
}

function renderImages(items) {
  if (!items.length) return;
  els.grid.innerHTML = items.map((src, i) => `
    <div class="card">
      <img src="${src}" alt="생성된 이미지 ${i+1}" loading="lazy">
      <div class="card-actions">
        <a href="${src}" download="ai-image-${Date.now()}-${i+1}.png">다운로드</a>
        <button onclick="window.open('${src}', '_blank')">새 탭</button>
      </div>
    </div>
  `).join('');
}

async function generate() {
  const key = els.apikey.value.trim();
  const prompt = els.prompt.value.trim();
  if (!key) return setStatus('API 키를 입력해주세요.', true);
  if (!prompt) return setStatus('프롬프트를 입력해주세요.', true);

  const model = els.model.value;
  const m = MODELS[model];
  const n = parseInt(els.count.value, 10);

  const body = { model, prompt, n, size: els.size.value };
  if (m.qualities) body.quality = els.quality.value;
  // gpt-image 계열은 항상 base64로 반환됨. dall-e 계열만 b64_json 요청.
  if (!model.startsWith('gpt-image-')) body.response_format = 'b64_json';

  els.generate.disabled = true;
  setStatus('생성 중... (모델/크기에 따라 수십 초 걸릴 수 있어요)', false, true);
  showSkeletons(n);

  try {
    const res = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = data?.error?.message || `요청 실패 (HTTP ${res.status})`;
      throw new Error(msg);
    }
    const imgs = (data.data || []).map(d =>
      d.b64_json ? 'data:image/png;base64,' + d.b64_json : d.url
    ).filter(Boolean);
    renderImages(imgs);
    setStatus(`완료 · ${imgs.length}장 생성됨`);
  } catch (err) {
    els.grid.innerHTML = '<div class="empty">생성에 실패했습니다.</div>';
    setStatus(err.message || '알 수 없는 오류', true);
  } finally {
    els.generate.disabled = false;
  }
}

els.generate.addEventListener('click', generate);
els.prompt.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
});
</script>
</body>
</html>
